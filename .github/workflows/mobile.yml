name: Aplikacje mobilne

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libjson-c-dev ninja-build
      - run: cmake -S mobile/native -B build/native -G Ninja && cmake --build build/native && ctest --test-dir build/native --output-on-failure

  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            triplet: arm64-android
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.cjs
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Instalacja NDK
        if: matrix.platform == 'android'
        run: |
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 664933b8d385dfc01f4e0cdff4c7c74e71f6a740
          path: .vcpkg
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: .vcpkg-cache
          key: native-${{ runner.os }}-arm-universal-28-v3-${{ hashFiles('mobile/native/vcpkg.json', 'mobile/native/triplets/*.cmake') }}
      - name: Przygotowanie bibliotek C++
        run: .vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Kompilacja silnika Android
        if: matrix.platform == 'android'
        run: |
          # Jeden APK obsługuje oba systemy ARM, także 32-bitowy na procesorze 64-bitowym.
          for spec in 'arm64-android arm64-v8a aarch64-linux-android' 'arm-android armeabi-v7a arm-linux-androideabi'; do
            read -r triplet abi toolchain <<< "$spec"
            cmake -S mobile/native -B "build/native-$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DVCPKG_TARGET_TRIPLET="$triplet" -DANDROID_ABI="$abi" -DANDROID_PLATFORM=24 \
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/mobile/native/triplets" \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/native-$abi" --parallel 3
            dest="mobile/plugin/android/src/main/jniLibs/$abi"
            mkdir -p "$dest" build/native/licenses
            cp "build/native-$abi/libcinema.so" "$dest/"
            cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$toolchain/libc++_shared.so" "$dest/"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$dest"/*.so
            cp "build/native-$abi/licenses/"* build/native/licenses/
          done
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: .vcpkg-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Przygotowanie projektu telefonu
        run: npm run mobile:${{ matrix.platform }}
      - name: Testy interfejsu telefonu
        if: matrix.platform == 'android'
        run: |
          npx playwright install --with-deps chromium
          npm test
          npm run test:ui
      - name: Podpisanie i zbudowanie APK
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist/mobile-release
          chmod +x android/gradlew
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cinema.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            (cd android && ./gradlew assembleRelease --no-daemon)
            cp android/app/build/outputs/apk/release/app-release.apk dist/mobile-release/CinemaMovieFinder-Android.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/mobile-release/CinemaMovieFinder-Android.apk
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/mobile-release/CinemaMovieFinder-Android.apk
          else
            # PR z forka nie otrzymuje sekretów, ale nadal sprawdza kompilację.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo 'Brakuje klucza podpisu Android.'; exit 1; fi
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/mobile-release/CinemaMovieFinder-Android-debug.apk
          fi
      - name: Sprawdzenie kompatybilności gotowego APK
        run: |
          # Sprawdzamy wynik scalania manifestów, a nie tylko deklarację w Gradle.
          apk=$(find dist/mobile-release -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee build/apk-badging.txt
          grep -qx "sdkVersion:'24'" build/apk-badging.txt
          grep -qx "targetSdkVersion:'36'" build/apk-badging.txt
          grep -q "native-code:.*'armeabi-v7a'" build/apk-badging.txt
          grep -q "native-code:.*'arm64-v8a'" build/apk-badging.txt
          for abi in armeabi-v7a arm64-v8a; do
            unzip -l "$apk" "lib/$abi/libcinema.so" "lib/$abi/libc++_shared.so" | tee "build/apk-$abi.txt"
            grep -q "lib/$abi/libcinema.so" "build/apk-$abi.txt"
            grep -q "lib/$abi/libc++_shared.so" "build/apk-$abi.txt"
          done
          # Weryfikacja schematów podpisu obowiązujących na Androidzie 7, 13 i 14.
          for api in 24 33 34; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version "$api" --max-sdk-version "$api" "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaMovieFinder-${{ matrix.platform }}
          path: dist/mobile-release/*
          if-no-files-found: error
